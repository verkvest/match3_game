# Export a Cindermote Android App Bundle and APK with Godot 4.7.2.
# targetSdk is 36 (Android 16), which is what Google Play requires for new
# apps and updates as of 31 August 2026. minSdk is 24. ABI is arm64-v8a.
#
# Release signing secrets (create a Play upload keystore, then add these):
#   ANDROID_KEYSTORE_B64       base64 of the .jks/.keystore file (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password. Godot has a single password
#                              field, so the key password must be the same value.
#   ANDROID_KEY_ALIAS          key alias inside the keystore
# Optional:
#   ANDROID_KEY_PASSWORD       if set, it must equal ANDROID_KEYSTORE_PASSWORD
#
# Until those secrets exist, this workflow uploads a debug-signed APK instead
# of a release AAB/APK. Debug builds are for sideload checks, not Play.
name: android-release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  phone-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libxcursor1 libxi6 libxrandr2 libxinerama1 libx11-6 libfontconfig1 mesa-utils
          sudo apt-get install -y libglu1-mesa || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - name: Install Godot 4.7.2
        run: bash tools/ci/install_godot.sh editor
      - name: Capture menu and level at iPhone 14 logical size
        env:
          CINDERMOTE_SCREENSHOT: ${{ runner.temp }}/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          mkdir -p "$CINDERMOTE_SCREENSHOT"
          # PNG/font importers and class_name registration only exist after an
          # editor import. Without it the game stays open and the step times out.
          "$GODOT_BIN" --headless --path . --import
          # Force X11 + OpenGL. A Vulkan probe on the hosted runner never
          # presents a frame, so the screenshot wait would hang.
          timeout 180 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            "$GODOT_BIN" --path . \
              --display-driver x11 \
              --rendering-driver opengl3 \
              --rendering-method gl_compatibility \
              --audio-driver Dummy \
              --resolution 390x844
          ls -la "$CINDERMOTE_SCREENSHOT"
          test -s "$CINDERMOTE_SCREENSHOT/menu.png"
          test -s "$CINDERMOTE_SCREENSHOT/level.png"
      - uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (API 36, build-tools 36.1.0, NDK 29)
        run: |
          set -euo pipefail
          # The hosted image already has the SDK. android-actions/setup-android@v3
          # fails because it still installs the removed "tools" package.
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          test -n "$SDKMANAGER" -a -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "platform-tools" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Godot 4.7.2 and export templates
        run: bash tools/ci/install_godot.sh full

      - name: Install Android build template
        run: |
          set -euo pipefail
          # use_gradle_build needs res://android/build from android_source.zip.
          # Godot's editor writes android/.build_version as 4.7.2.stable.
          TMPL="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/4.7.2.stable"
          test -f "$TMPL/android_source.zip"
          rm -rf android
          mkdir -p android/build
          printf '4.7.2.stable\n' > android/.build_version
          : > android/build/.gdignore
          unzip -q -o "$TMPL/android_source.zip" -d android/build
          test -f android/build/build.gradle

      - name: Debug keystore and editor settings
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$HOME/.local/share/godot/keystores"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_DIR/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          SETTINGS_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE_DIR/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # 4.7 also reads a versioned file when it exists; keep both in sync.
          cp "$SETTINGS_DIR/editor_settings-4.tres" "$SETTINGS_DIR/editor_settings-4.7.tres"

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keys/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keys/release.keystore" >> "$GITHUB_ENV"

      - name: Patch version code and signing
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/ci/patch_android_preset.py export_presets.cfg

      - name: Export release AAB and APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-release "Android AAB" build/android/cindermote.aab
          "$GODOT_BIN" --headless --path . --export-release "Android APK" build/android/cindermote.apk
          ls -la build/android
          test -s build/android/cindermote.aab
          test -s build/android/cindermote.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/android/cindermote.apk | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"

      - name: Export debug APK (release keystore secrets are not set)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          set -euo pipefail
          echo "::notice::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS are not all set. Exporting a debug-signed APK instead of a Play release."
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-debug "Android APK" build/android/cindermote-debug.apk
          ls -la build/android
          test -s build/android/cindermote-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/android/cindermote-debug.apk | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: cindermote-aab
          path: build/android/cindermote.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: cindermote-apk
          path: build/android/cindermote.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: cindermote-debug-apk
          path: build/android/cindermote-debug.apk
