# Export Cindermote with Godot 4.7.2, archive it, and upload to TestFlight.
# Signing matches the owner's working zeroad workflow: xcodebuild -exportArchive
# with -allowProvisioningUpdates and the App Store Connect API key.
#
# Required repo secrets (already used by the owner's other iOS workflow):
#   APPSTORE_API_KEY_P8      contents of AuthKey_<KEYID>.p8, raw PEM or base64
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
# The key needs Admin or App Manager so Xcode can create the distribution
# certificate and provisioning profile (cloud-managed automatic signing).
# Team ID 38PT254HDZ (ALEKSANDR VERKHOVOD). Bundle id es.verkvest.cindermote.
#
# The App Store Connect *app record* cannot be created via the API. This
# workflow registers the bundle id (POST /v1/bundleIds) when it is missing.
# If upload fails only because that app record does not exist yet, the job
# stops with an explicit error. Create the record in App Store Connect:
# Apps → + → New App, name Cindermote, bundle id es.verkvest.cindermote.
name: ios-testflight

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["testflight-*"]

env:
  TEAM_ID: 38PT254HDZ
  BUNDLE_ID: es.verkvest.cindermote
  APP_NAME: Cindermote
  APP_VERSION: "1.0.0"

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::App Store Connect API key secrets are not set – skipping signing and upload."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - name: Xcode 26 (App Store requires the iOS 26 SDK)
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -n "${X:-}" ]; then
            sudo xcode-select -s "$X"
          fi
          xcodebuild -version

      - name: Install Godot 4.7.2 and export templates
        if: env.HAS_KEY == 'true'
        run: bash tools/ci/install_godot.sh full

      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"
          echo "APPSTORE_API_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"

      - name: Register bundle id if missing
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc-venv/bin/python" tools/asc_ensure_bundle_id.py

      - name: Export Godot iOS project
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" build/ios/Cindermote \
            2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          find build/ios -name '*.xcodeproj' -o -name '*.plist' | head -40

      - name: Set ITSAppUsesNonExemptEncryption=false
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r PLIST; do
            if /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" >/dev/null 2>&1; then
              while /usr/libexec/PlistBuddy -c 'Delete :ITSAppUsesNonExemptEncryption' "$PLIST" 2>/dev/null; do
                true
              done
              /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$PLIST"
              echo "$PLIST -> $(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")"
              found=1
            fi
          done < <(find build/ios -name '*.plist')
          test "$found" -eq 1

      - name: Archive (unsigned; distribution signing happens at export)
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROJ=$(find build/ios -name '*.xcodeproj' | head -1)
          test -n "$PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          echo "project=$PROJ scheme=$SCHEME"
          set +e
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cindermote.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$APP_VERSION" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            SKIP_INSTALL=NO INSTALL_PATH=/Applications \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -80
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          find "$RUNNER_TEMP/Cindermote.xcarchive" -maxdepth 3 | head -30
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/Cindermote.xcarchive/Info.plist"

      - name: Export with App Store distribution signing and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cindermote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          # Re-check immediately before upload. The record may have been
          # created while the archive was building, and GITHUB_ENV from the
          # earlier step would still say it was missing.
          record="$("$RUNNER_TEMP/asc-venv/bin/python" tools/asc_ensure_bundle_id.py | tee "$RUNNER_TEMP/asc-record.log" | awk -F= '/^APP_RECORD=/{v=$2} END{print v}')"
          echo "APP_RECORD=$record"
          if [ "$record" = "no" ]; then
            echo "::error::No App Store Connect app record for $BUNDLE_ID. Export, archive, and App Store signing succeeded. The API cannot create the app record, so the upload was not attempted. Create it in App Store Connect → Apps → + → New App (name: $APP_NAME, bundle id: $BUNDLE_ID, SKU: cindermote), then re-run this workflow."
            exit 1
          fi
          set +e
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq "ERROR|UPLOAD FAILED" "$RUNNER_TEMP/upload.log"; then
            if grep -Eq "Cannot determine the Apple ID|No suitable application records were found|could not find an application|Unable to find application" "$RUNNER_TEMP/upload.log"; then
              echo "::error::No App Store Connect app record for $BUNDLE_ID. Export, archive, and signing succeeded; upload stopped because the app record does not exist. Create it in App Store Connect → Apps → + → New App (name: $APP_NAME, bundle id: $BUNDLE_ID, SKU: cindermote), then re-run this workflow."
            else
              echo "::error::TestFlight upload failed. See the altool log."
            fi
            exit 1
          fi
          test "$status" -eq 0
          echo "::notice::Uploaded $BUNDLE_ID $APP_VERSION (${{ github.run_number }}) to App Store Connect"

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_KEY == 'true'
        with:
          name: ios-testflight-logs
          path: |
            ${{ runner.temp }}/godot-export.log
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore

      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
